# 채점 환경과 같은 조건(Ubuntu 22.04 LTS / x86_64 / 4코어 / Python 3.10)에서
# 검수 절차를 그대로 돌리고 속도를 측정한다.
#
# 개발 머신이 Apple Silicon(arm64)이라 로컬 측정치를 그대로 보고할 수 없다.
# GitHub 호스티드 러너가 공개 저장소에 무료로 주는 ubuntu-22.04 이미지가
# x86_64 4코어라 채점 환경과 CPU 규격이 같다(RAM 은 16GB 로 더 넉넉함).
#
# 같은 이미지 묶음(custom_data 97장)을 arm64 로컬에서도 재서 배율을 구하고,
# 그 배율을 대회 이미지 904장 실측(arm64)에 곱해 x86 예상치를 낸다.
# custom_data 는 긴 변 중앙값이 2048로 대회 원본(1196)보다 커서
# 여기서 나온 장당 시간 자체는 상한으로 읽어야 한다.

name: verify-x86

on:
  workflow_dispatch:
  push:
    branches: [KGW_rapidocr]
    paths:
      - 'predict.ipynb'
      - 'date_parser.py'
      - 'date_parser_plus.py'
      - 'gap_fill.py'
      - 'preprocess.py'
      - 'ocr_normalize.py'
      - 'partial_rescue.py'
      - 'requirements.txt'
      - 'pipeline.py'
      - 'parallel_worker.py'
      - 'config_ko.yaml'
      - 'weights/**'
      - '.github/workflows/verify-x86.yml'

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 채점 환경 규격 기록
        run: |
          echo "## 측정 환경" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          { uname -srm
            lsb_release -d 2>/dev/null || cat /etc/os-release | head -2
            echo "물리/논리 코어: $(nproc)"
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz' || true
            free -h | head -2
          } | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1) pip install -r requirements.txt
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -V
          pip install --upgrade pip
          pip install -r requirements.txt
          pip list --format=freeze

      - name: 2) bash download_weights.sh
        run: |
          . .venv/bin/activate
          bash download_weights.sh

      - name: 3) 검수 명령 그대로 (sample 5장)
        run: |
          . .venv/bin/activate
          ITDA_INPUT_DIR=./sample ITDA_OUTPUT_PATH=/tmp/out.csv OMP_NUM_THREADS=4 \
            jupyter nbconvert --to notebook --execute predict.ipynb --output /tmp/executed.ipynb
          echo "--- 결과 ---"; cat /tmp/out.csv
          echo "--- 정답 ---"; cat docs/sample_expected.csv

      - name: 4) 속도 측정 (custom_data 97장, 최대 메모리 포함)
        run: |
          . .venv/bin/activate
          # 병렬 실행이라 /usr/bin/time 의 최대 RSS 는 가장 큰 프로세스 하나뿐이다.
          # 작업 프로세스까지 합친 PSS(공유 페이지를 나눠 센 값) 최댓값을 따로 잰다.
          echo 0 > /tmp/pss_peak
          ( set +e; while true; do
              t=0; for p in $(pgrep -f "python|jupyter"); do
                v=$(awk '/^Pss:/{print $2}' /proc/$p/smaps_rollup 2>/dev/null); t=$((t + ${v:-0})); done
              [ $t -gt $(cat /tmp/pss_peak) ] && echo $t > /tmp/pss_peak; sleep 1; done ) & mon=$!
          /usr/bin/time -v env \
            ITDA_INPUT_DIR=./custom_data/images ITDA_OUTPUT_PATH=/tmp/speed.csv OMP_NUM_THREADS=4 \
            jupyter nbconvert --to notebook --execute predict.ipynb --output /tmp/speed.ipynb \
            2> /tmp/time.txt || true
          kill $mon 2>/dev/null || true
          echo "## 속도·메모리 (custom_data 97장)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'Elapsed|Maximum resident' /tmp/time.txt | tee -a $GITHUB_STEP_SUMMARY
          echo "전체 프로세스 PSS 합 최대: $(( $(cat /tmp/pss_peak) / 1024 )) MB" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python - <<'PY' | tee -a $GITHUB_STEP_SUMMARY
          import json,re
          nb=json.load(open('/tmp/speed.ipynb'))
          for c in nb['cells']:
              for o in c.get('outputs',[]):
                  for l in ''.join(o.get('text',[]) or []).split('\n'):
                      if '장당' in l or '총 ' in l: print(l)
          PY

      - name: 4-1) 병렬 실행 확인
        # 리눅스에서 병렬이 조용히 순차로 넘어가던 사고(10/2)를 다시 못 넘어가게 막는다.
        run: |
          python - <<'PY'
          import json, sys
          bad = False
          for f in ("/tmp/executed.ipynb", "/tmp/speed.ipynb"):
              txt = "".join("".join(o.get("text", [])) for c in json.load(open(f))["cells"] for o in c.get("outputs", []))
              line = [l for l in txt.splitlines() if l.startswith("총 ")]
              print(f, "→", line[-1] if line else "(총 줄 없음)")
              if "병렬 실패" in txt or not any("병렬 " in l for l in line):
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: 5) 정답 대조 (custom_data)
        run: |
          . .venv/bin/activate
          python evaluate.py /tmp/speed.csv custom_data/labels.csv "custom_data(x86)" | tee -a $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-x86-logs
          path: |
            /tmp/out.csv
            /tmp/speed.csv
            /tmp/time.txt
