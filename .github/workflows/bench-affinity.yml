# 실험용: fork 작업 프로세스의 CPU 고정 상속 진단 + 수정본 노트북 재측정 (speed-bench 전용)
name: bench-affinity
on:
  workflow_dispatch:   # 진단 완료(10/2). 수동 실행만.
jobs:
  bench:
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt && bash download_weights.sh
      - name: CPU 고정 진단
        run: |
          { echo '```'; lscpu | grep -E "Model name|Thread\(s\) per core|Core\(s\) per socket"; OMP_NUM_THREADS=4 timeout 600 python bench/affinity_diag.py 2>&1 | grep -v "^YOLO\|^입력"; echo '```'; } | tee -a $GITHUB_STEP_SUMMARY
      - name: 노트북 3종 (194장, 2회 교대)
        run: |
          mkdir -p /tmp/in; for k in 1 2; do for f in custom_data/images/*; do cp "$f" "/tmp/in/r${k}_$(basename "$f")"; done; done
          echo '| 실행 | Run All 초 |' >> $GITHUB_STEP_SUMMARY; echo '|---|---|' >> $GITHUB_STEP_SUMMARY
          for r in 1 2; do for nb in predict predict_parallel_nofix predict_parallel; do
            s=$(date +%s.%N)
            ITDA_INPUT_DIR=/tmp/in ITDA_OUTPUT_PATH=/tmp/${nb}_$r.csv OMP_NUM_THREADS=4 \
              jupyter nbconvert --to notebook --execute $nb.ipynb --output /tmp/x_${nb}_$r.ipynb 2>/dev/null
            e=$(date +%s.%N); echo "| $nb r$r | $(echo "$e - $s" | bc) |" | tee -a $GITHUB_STEP_SUMMARY
          done; done
          for r in 1 2; do for nb in predict_parallel_nofix predict_parallel; do
            cmp -s /tmp/predict_$r.csv /tmp/${nb}_$r.csv && echo "$nb r$r 출력 동일" || echo "$nb r$r 출력 다름"
          done; done | tee -a $GITHUB_STEP_SUMMARY
